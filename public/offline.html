<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <title>Connection required · virtual-home</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #faf9f5;
        color: #24221f;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        box-sizing: border-box;
      }
      main {
        width: min(28rem, 100%);
        border: 1px solid #d9d6ce;
        border-radius: 0.75rem;
        background: #fffefa;
        padding: 1.5rem;
        box-sizing: border-box;
        box-shadow: 0 1px 2px rgb(36 34 31 / 8%);
      }
      img {
        width: 3rem;
        height: 3rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.25rem;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0;
        color: #625f58;
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #161513;
          color: #f3f0e9;
        }
        main {
          background: #1e1c19;
          border-color: #3d3933;
          box-shadow: none;
        }
        p {
          color: #bbb5aa;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/house.svg" alt="" />
      <h1>Connection required</h1>
      <p>
        virtual-home keeps household information on the home server. Reconnect to its network, then
        reopen or refresh the app.
      </p>
    </main>
  </body>
</html>
